name: Update PR graph
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check chart builder
        run: python -m unittest discover -s tests -v
      - name: Build from public GitHub pull requests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_pr_graph.py
      - name: Commit graph when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/pull-requests.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh real PR activity chart'
            git push
          fi
